collectors:
    - name: PCGamer
      url: https://www.pcgamer.com/uk/news/
      container:
          attr: data-list
          value: home/latest
          child:
              type: class
              value: listingResult
      data:
          title:
              attr: class
              value: article-name
          href:
              type: a
              attr: href
          img:
              type: figure
              attr: data-original
          timestamp:
              type: time
              attr: datetime

